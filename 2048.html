<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #faf8ef;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #776e65;
            font-size: 48px;
            margin: 20px 0;
        }

        .score-container {
            margin: 20px 0;
        }

        .score {
            background-color: #bbada0;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            display: inline-block;
            margin: 0 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .game-container {
            position: relative;
            background-color: #bbada0;
            border-radius: 10px;
            width: 500px;
            height: 500px;
            margin: 20px auto;
            padding: 15px;
            box-sizing: border-box;
        }

        .grid-container {
            position: absolute;
            z-index: 1;
        }

        .grid-row {
            display: flex;
        }

        .grid-cell {
            width: 107px;
            height: 107px;
            background-color: rgba(238, 228, 218, 0.35);
            border-radius: 6px;
            margin: 7px;
        }

        .tile-container {
            position: absolute;
            z-index: 2;
        }

        .tile {
            position: absolute;
            width: 107px;
            height: 107px;
            background-color: #eee4da;
            border-radius: 6px;
            margin: 7px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #776e65;
            transition: all 0.15s ease-in-out;
        }

        .tile-2 { background-color: #eee4da; color: #776e65; }
        .tile-4 { background-color: #ede0c8; color: #776e65; }
        .tile-8 { background-color: #f2b179; color: #f9f6f2; }
        .tile-16 { background-color: #f59563; color: #f9f6f2; }
        .tile-32 { background-color: #f67c5f; color: #f9f6f2; }
        .tile-64 { background-color: #f65e3b; color: #f9f6f2; }
        .tile-128 { background-color: #edcf72; color: #f9f6f2; font-size: 28px; }
        .tile-256 { background-color: #edcc61; color: #f9f6f2; font-size: 28px; }
        .tile-512 { background-color: #edc850; color: #f9f6f2; font-size: 28px; }
        .tile-1024 { background-color: #edc53f; color: #f9f6f2; font-size: 24px; }
        .tile-2048 { background-color: #edc22e; color: #f9f6f2; font-size: 24px; }

        .controls {
            margin: 20px 0;
        }

        .restart-btn {
            background-color: #8f7a66;
            color: #f9f6f2;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 0 10px;
        }

        .restart-btn:hover {
            background-color: #9f8a76;
        }

        .game-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #776e65;
            z-index: 100;
            display: none;
        }

        .instructions {
            margin: 20px 0;
            color: #776e65;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>2048</h1>

    <div class="score-container">
        <div class="score">
            Score: <span id="score">0</span>
        </div>
        <div class="score">
            Best: <span id="best">0</span>
        </div>
    </div>

    <div class="controls">
        <button class="restart-btn" onclick="game.restart()">New Game</button>
    </div>

    <div class="instructions">
        Use arrow keys to move tiles. When two tiles with the same number touch, they merge into one!
    </div>

    <div class="game-container">
        <div class="grid-container">
            <div class="grid-row">
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
            </div>
            <div class="grid-row">
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
            </div>
            <div class="grid-row">
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
            </div>
            <div class="grid-row">
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
            </div>
        </div>
        <div class="tile-container" id="tile-container"></div>
        <div class="game-message" id="game-message"></div>
    </div>

    <script>
        class Game2048 {
            constructor() {
                this.grid = [];
                this.score = 0;
                this.best = localStorage.getItem('best2048') || 0;
                this.size = 4;
                this.tileContainer = document.getElementById('tile-container');
                this.scoreElement = document.getElementById('score');
                this.bestElement = document.getElementById('best');
                this.messageElement = document.getElementById('game-message');

                this.init();
                this.setupEventListeners();
            }

            init() {
                this.grid = Array(this.size).fill().map(() => Array(this.size).fill(0));
                this.score = 0;
                this.updateScore();
                this.addRandomTile();
                this.addRandomTile();
                this.updateDisplay();
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                        e.preventDefault();
                        this.handleKeyPress(e.key);
                    }
                });
            }

            handleKeyPress(key) {
                let moved = false;
                let previousGrid = this.grid.map(row => [...row]);

                switch(key) {
                    case 'ArrowUp':
                        moved = this.moveUp();
                        break;
                    case 'ArrowDown':
                        moved = this.moveDown();
                        break;
                    case 'ArrowLeft':
                        moved = this.moveLeft();
                        break;
                    case 'ArrowRight':
                        moved = this.moveRight();
                        break;
                }

                if (moved) {
                    this.addRandomTile();
                    this.updateDisplay();
                    this.updateScore();

                    if (this.checkWin()) {
                        this.showMessage('You Win!');
                    } else if (this.checkGameOver()) {
                        this.showMessage('Game Over!');
                    }
                }
            }

            moveLeft() {
                let moved = false;
                for (let row = 0; row < this.size; row++) {
                    let arr = this.grid[row].filter(cell => cell !== 0);
                    for (let col = 0; col < arr.length - 1; col++) {
                        if (arr[col] === arr[col + 1]) {
                            arr[col] *= 2;
                            this.score += arr[col];
                            arr.splice(col + 1, 1);
                        }
                    }
                    while (arr.length < this.size) {
                        arr.push(0);
                    }
                    if (JSON.stringify(this.grid[row]) !== JSON.stringify(arr)) {
                        moved = true;
                    }
                    this.grid[row] = arr;
                }
                return moved;
            }

            moveRight() {
                let moved = false;
                for (let row = 0; row < this.size; row++) {
                    let arr = this.grid[row].filter(cell => cell !== 0);
                    for (let col = arr.length - 1; col > 0; col--) {
                        if (arr[col] === arr[col - 1]) {
                            arr[col] *= 2;
                            this.score += arr[col];
                            arr.splice(col - 1, 1);
                            col--;
                        }
                    }
                    while (arr.length < this.size) {
                        arr.unshift(0);
                    }
                    if (JSON.stringify(this.grid[row]) !== JSON.stringify(arr)) {
                        moved = true;
                    }
                    this.grid[row] = arr;
                }
                return moved;
            }

            moveUp() {
                let moved = false;
                for (let col = 0; col < this.size; col++) {
                    let arr = [];
                    for (let row = 0; row < this.size; row++) {
                        if (this.grid[row][col] !== 0) {
                            arr.push(this.grid[row][col]);
                        }
                    }
                    for (let i = 0; i < arr.length - 1; i++) {
                        if (arr[i] === arr[i + 1]) {
                            arr[i] *= 2;
                            this.score += arr[i];
                            arr.splice(i + 1, 1);
                        }
                    }
                    while (arr.length < this.size) {
                        arr.push(0);
                    }
                    for (let row = 0; row < this.size; row++) {
                        if (this.grid[row][col] !== arr[row]) {
                            moved = true;
                        }
                        this.grid[row][col] = arr[row];
                    }
                }
                return moved;
            }

            moveDown() {
                let moved = false;
                for (let col = 0; col < this.size; col++) {
                    let arr = [];
                    for (let row = 0; row < this.size; row++) {
                        if (this.grid[row][col] !== 0) {
                            arr.push(this.grid[row][col]);
                        }
                    }
                    for (let i = arr.length - 1; i > 0; i--) {
                        if (arr[i] === arr[i - 1]) {
                            arr[i] *= 2;
                            this.score += arr[i];
                            arr.splice(i - 1, 1);
                            i--;
                        }
                    }
                    while (arr.length < this.size) {
                        arr.unshift(0);
                    }
                    for (let row = 0; row < this.size; row++) {
                        if (this.grid[row][col] !== arr[row]) {
                            moved = true;
                        }
                        this.grid[row][col] = arr[row];
                    }
                }
                return moved;
            }

            addRandomTile() {
                let emptyCells = [];
                for (let row = 0; row < this.size; row++) {
                    for (let col = 0; col < this.size; col++) {
                        if (this.grid[row][col] === 0) {
                            emptyCells.push({row, col});
                        }
                    }
                }

                if (emptyCells.length > 0) {
                    let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    this.grid[randomCell.row][randomCell.col] = Math.random() < 0.9 ? 2 : 4;
                }
            }

            updateDisplay() {
                this.tileContainer.innerHTML = '';

                for (let row = 0; row < this.size; row++) {
                    for (let col = 0; col < this.size; col++) {
                        if (this.grid[row][col] !== 0) {
                            let tile = document.createElement('div');
                            tile.className = `tile tile-${this.grid[row][col]}`;
                            tile.textContent = this.grid[row][col];
                            tile.style.left = `${col * 121 + 7}px`;
                            tile.style.top = `${row * 121 + 7}px`;
                            this.tileContainer.appendChild(tile);
                        }
                    }
                }
            }

            updateScore() {
                this.scoreElement.textContent = this.score;
                if (this.score > this.best) {
                    this.best = this.score;
                    localStorage.setItem('best2048', this.best);
                }
                this.bestElement.textContent = this.best;
            }

            checkWin() {
                for (let row = 0; row < this.size; row++) {
                    for (let col = 0; col < this.size; col++) {
                        if (this.grid[row][col] === 2048) {
                            return true;
                        }
                    }
                }
                return false;
            }

            checkGameOver() {
                // Check for empty cells
                for (let row = 0; row < this.size; row++) {
                    for (let col = 0; col < this.size; col++) {
                        if (this.grid[row][col] === 0) {
                            return false;
                        }
                    }
                }

                // Check for possible merges
                for (let row = 0; row < this.size; row++) {
                    for (let col = 0; col < this.size; col++) {
                        let current = this.grid[row][col];
                        if ((row < this.size - 1 && this.grid[row + 1][col] === current) ||
                            (col < this.size - 1 && this.grid[row][col + 1] === current)) {
                            return false;
                        }
                    }
                }

                return true;
            }

            showMessage(text) {
                this.messageElement.textContent = text;
                this.messageElement.style.display = 'block';
                setTimeout(() => {
                    this.messageElement.style.display = 'none';
                }, 2000);
            }

            restart() {
                this.init();
            }
        }

        // Initialize the game
        const game = new Game2048();
    </script>
</body>
</html>
